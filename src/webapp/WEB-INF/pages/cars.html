<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cars List</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #333;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cars List</h1>
        
        <table>
            <thead>
                <tr>
                    <th>Brand</th>
                    <th>Model</th>
                    <th>Year</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="car : ${cars}">
                    <td th:text="${car.brand}"></td>
                    <td th:text="${car.model}"></td>
                    <td th:text="${car.year}"></td>
                </tr>
            </tbody>
        </table>
        
        <div style="margin-top: 20px; text-align: center;">
            <p>Showing <span th:text="${cars.size()}"></span> cars</p>
            <p>
                <a th:href="@{/cars}">Show all cars</a> | 
                <a th:href="@{/cars(count=1)}">Show 1 car</a> | 
                <a th:href="@{/cars(count=2)}">Show 2 cars</a> | 
                <a th:href="@{/cars(count=3)}">Show 3 cars</a> | 
                <a th:href="@{/cars(count=4)}">Show 4 cars</a> | 
                <a th:href="@{/cars(count=5)}">Show 5 cars</a>
            </p>
        </div>
    </div>
</body>
</html>
